name: Sync Trello Status

on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 BRT (UTC-3)
  workflow_dispatch:

jobs:
  sync:
    name: Fetch Trello & update JSON + HTML
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Trello → trello-status.json
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: node scripts/sync-trello.cjs

      - name: Injetar datas reais no trello-projetos.html
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let html = fs.readFileSync('trello-projetos.html', 'utf8');
          const json = JSON.parse(fs.readFileSync('trello-status.json', 'utf8'));
          const coords = {
            'Transpetro - Caxias - Duto':[-22.77,-43.31],'Projeto Inpasa':[-15.60,-56.09],
            'Stang - Itajaí':[-26.91,-48.66],'Greenfield - Itajaí - Rede galo':[-26.91,-48.66],
            'PECEM':[-3.55,-38.72],'Vitória - SPE - navegantes':[-26.90,-48.65],
            'Vitória - Base Santa Rosa':[-20.31,-40.33],'Vitória - Atlântica':[-20.33,-40.29],
            'WM - Vila velha':[-20.33,-40.29],'Negociação EFEN - Caxias':[-22.77,-43.31],
            'Rumos - Uberlândia':[-18.91,-48.27],'Paulínia - Torrão':[-22.76,-47.15],
            'Chapecó - Maxsul':[-27.10,-52.62],'Formação de pool - LEM/Açailândia':[-12.00,-44.71],
            'Ampliar o contrato da Pontual - Araucaria':[-25.59,-49.41],
            'Ypetro - Maracanau (Ceará)':[-3.87,-38.62],'Vitória - Oiltank':[-20.31,-40.33],
            'Paulínia - Opla':[-22.76,-47.15],'BID São Luís':[-2.53,-44.30],
            'BID Ipojuca':[-8.40,-35.07],'Belém - TOP':[-1.45,-48.50],
            'oPhase Out BA (Jequié e Itabuna)':[-13.86,-40.08],'IPP Guarulhos+':[-23.45,-46.53],
            'Pool de Paulínia':[-22.76,-47.15],'IPP SJRP':[-20.82,-49.38],
            'Goiânia - Nexta':[-16.67,-49.25],'Santa Maria':[-29.68,-53.80],
            'Inpasa - NDA':[-15.60,-56.09],'PetroBahia - Caxias':[-22.77,-43.31],
            'Capex de Goiâinia - Swap de Tanques':[-16.67,-49.25],
            'Paulínia - S10 - Ipiranga':[-22.76,-47.15],'BID - Santos - Jun/26':[-23.96,-46.33],
            'Transpetro - Itajaí, Biguaçu, Guaramirim':[-26.91,-48.66],
            'Phase out Rio Grande':[-32.03,-52.09],'Phase-out Uberaba':[-19.75,-47.93],
            'Phase-Out Maceió':[-9.67,-35.73],'Phase-out Crato':[-7.23,-39.41]
          };
          const q = s => JSON.stringify(s);
          const today = new Date().toISOString().slice(0,10);
          const lines = json.cards.map(c => {
            const co = coords[c.name]||[null,null];
            const cr = c.createdAt?c.createdAt.slice(0,10):null;
            const la = c.dateLastActivity?c.dateLastActivity.slice(0,10):null;
            return '  {n:'+q(c.name)+',l:'+q(c.listName)+',s:'+q(c.status)+',due:'+(c.due?q(c.due.slice(0,10)):'null')+',url:'+q(c.url)+',cr:'+(cr?q(cr):'null')+',la:'+(la?q(la):'null')+',lat:'+co[0]+',lng:'+co[1]+'}';
          });
          html = html.replace(/const CARDS=\[[\s\S]*?\];/,'const CARDS=[\n'+lines.join(',\n')+'\n];');
          html = html.replace(/const UPDATED="[^"]+"/,'const UPDATED='+q(json.updatedAt));
          html = html.replace(/const TODAY=new Date\("[^"]+"\)/,'const TODAY=new Date("'+today+'")');
          fs.writeFileSync('trello-projetos.html',html);
          console.log('HTML atualizado: '+json.cards.length+' cards.');
          EOF

      - name: Commit se houve mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trello-status.json trello-projetos.html
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git pull --rebase origin main
            git add trello-status.json trello-projetos.html
            git commit -m "chore: sync Trello [$(date -u '+%Y-%m-%d %H:%M')] UTC"
            git push origin main
          fi
