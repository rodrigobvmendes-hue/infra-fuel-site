<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projetos Trello · InfraFuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f1117;color:#e2e8f0;font-size:14px}
.hdr{background:#161929;border-bottom:1px solid #2d3452;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.hdr h1{font-size:18px;font-weight:700;color:#fff}.hdr h1 span{color:#00c2ff}
.hdr-right{display:flex;align-items:center;gap:12px}
.hdr .meta{font-size:11px;color:#475569}
.hdr-btn{padding:5px 14px;border-radius:6px;border:1px solid #2d3452;background:#1e2130;color:#00c2ff;font-size:12px;font-weight:600;text-decoration:none;transition:.2s}
.hdr-btn:hover{border-color:#00c2ff;background:#00c2ff22}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 28px;background:#0d1021;border-bottom:1px solid #1e2844}
.kpi{background:#1e2130;border:1px solid #2d3452;border-radius:8px;padding:16px 18px;cursor:pointer;transition:border-color .2s,background .2s;position:relative;overflow:hidden;user-select:none}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-total::before{background:linear-gradient(90deg,#00c2ff,#0066ff)}
.kpi-ativo::before{background:#3b82f6}
.kpi-holding::before{background:#8b5cf6}
.kpi-concluido::before{background:#22c55e}
.kpi:hover,.kpi.active{border-color:#00c2ff;background:#1a2340}
.kpi.active .kpi-val,.kpi:hover .kpi-val{color:#00c2ff}
.kpi-lbl{font-size:10px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.kpi-val{font-size:26px;font-weight:700;color:#f1f5f9;line-height:1;transition:color .15s}
.kpi-sub{font-size:11px;color:#475569;margin-top:4px}
.toolbar{padding:12px 28px;background:#0d1021;border-bottom:1px solid #1e2844;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:57px;z-index:199}
.fbts{display:flex;gap:6px;flex-wrap:wrap}
.fbt{padding:5px 12px;border-radius:5px;border:1px solid #2d3452;background:#1e2130;color:#94a3b8;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.fbt:hover{border-color:#00c2ff;color:#00c2ff}
.fbt.active{background:#00c2ff22;border-color:#00c2ff;color:#00c2ff;font-weight:600}
.sep{width:1px;height:22px;background:#2d3452;flex-shrink:0}
.srch{position:relative}
.srch input{background:#1e2130;border:1px solid #2d3452;color:#e2e8f0;border-radius:5px;padding:6px 28px 6px 26px;font-size:12px;font-family:inherit;outline:none;width:210px;transition:border .2s}
.srch input:focus{border-color:#00c2ff}
.srch .si{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none}
.srch .sc{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:none;color:#64748b;cursor:pointer;font-size:11px;padding:2px;display:none}
.count-lbl{font-size:11px;color:#475569;margin-left:auto;white-space:nowrap}
.content{max-width:1800px;margin:0 auto;padding:20px 24px}
.sec-title{font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #1e2844;display:flex;align-items:center;gap:6px}
/* two-col layout */
.main-layout{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
.cards-col{min-width:0}
.map-col{position:sticky;top:118px}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
#map{height:calc(100vh - 200px);min-height:420px;max-height:700px;border-radius:8px;border:1px solid #2d3452;overflow:hidden}
@media(max-width:1100px){.main-layout{grid-template-columns:1fr}.map-col{position:static}.cards-grid{grid-template-columns:repeat(2,1fr)}#map{height:360px}}
@media(max-width:640px){.cards-grid{grid-template-columns:1fr}}
.pcard{background:#1e2130;border:1px solid #2d3452;border-radius:7px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .15s;border-left:3px solid transparent}
.pcard:hover{border-color:#3d4a6d;transform:translateY(-1px)}
.pcard.alert-card{border-left-color:#dc2626}
.pcard.warn-card{border-left-color:#c2410c}
.pcard[hidden]{display:none}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.pcard-name{font-size:12px;font-weight:600;color:#e2e8f0;line-height:1.3;flex:1}
.pcard-link{color:#475569;font-size:11px;text-decoration:none;flex-shrink:0;padding:1px 4px;border-radius:3px;transition:.15s}
.pcard-link:hover{color:#00c2ff;background:#00c2ff15}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px}
.b-andamento{background:#1d3461;color:#93c5fd;border:1px solid #2563eb}
.b-renovacao{background:#3d2a00;color:#fde68a;border:1px solid #d97706}
.b-analise{background:#3d1e00;color:#fdba74;border:1px solid #ea580c}
.b-afazer{background:#1e293b;color:#94a3b8;border:1px solid #334155}
.b-holding{background:#2e1065;color:#c4b5fd;border:1px solid #7c3aed}
.b-concluido{background:#052e16;color:#86efac;border:1px solid #16a34a}
.due-badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;background:#422006;color:#fed7aa;border:1px solid #c2410c}
.due-over{background:#450a0a;color:#fca5a5;border:1px solid #dc2626}
.pcard-divider{height:1px;background:#1e2844;margin:2px 0}
.pcard-meta{display:flex;flex-direction:column;gap:2px}
.pcard-row{display:flex;align-items:center;gap:5px;font-size:10px;color:#64748b}
.pcard-row .v{color:#94a3b8}
.dias-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px}
.dias-ok{background:#052e16;color:#86efac;border:1px solid #15803d}
.dias-warn{background:#422006;color:#fed7aa;border:1px solid #c2410c}
.dias-alert{background:#450a0a;color:#fca5a5;border:1px solid #dc2626}
/* insights strip */
.insights{display:flex;gap:8px;flex-wrap:wrap;padding:10px 28px;background:#0a0e1a;border-bottom:1px solid #1e2844}
.ins-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:5px;white-space:nowrap}
.ins-alert{background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d}
.ins-warn{background:#422006;color:#fed7aa;border:1px solid #7c2d12}
.ins-ok{background:#052e16;color:#86efac;border:1px solid #14532d}
.ins-info{background:#0f172a;color:#93c5fd;border:1px solid #1e3a5f}
.ins-neutral{background:#1e2130;color:#94a3b8;border:1px solid #2d3452}
/* #map height controlled by .map-col rule above */
.leaflet-popup-content-wrapper{background:#1e2130;border:1px solid #2d3452;color:#e2e8f0;border-radius:7px;font-family:'Inter',sans-serif}
.leaflet-popup-content{font-size:12px;line-height:1.6;margin:10px 14px}
.leaflet-popup-content b{color:#00c2ff}
.leaflet-popup-tip{background:#1e2130}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:#64748b;margin-bottom:32px}
.map-legend span{display:flex;align-items:center;gap:5px}
.leg-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.empty-msg{text-align:center;padding:48px;color:#475569;font-size:13px;grid-column:1/-1}

@media(max-width:560px){.cards-grid{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

</div>

function days(d){return d?Math.floor((TODAY-new Date(d))/(864e5)):null}
function fd(d){if(!d)return"—";const p=d.slice(0,10).split("-");return`${p[2]}/${p[1]}/${p[0]}`}
function diasBadge(d,s){
  if(s==="concluido"||d===null)return"";
  const cl=d<=14?"dias-ok":d<=30?"dias-warn":"dias-alert";
  const ic=d<=14?"✅":d<=30?"⚠️":"🔴";
  return`<span class="dias-badge ${cl}">${ic} ${d}d sem avanço</span>`;
}
function buildInsights(vis){
  const ativos=vis.filter(c=>c.s!=="concluido");
  const alert30=ativos.filter(c=>{ const d=days(c.la); return d!==null&&d>30; });
  const warn15=ativos.filter(c=>{ const d=days(c.la); return d!==null&&d>14&&d<=30; });
  const ok14=ativos.filter(c=>{ const d=days(c.la); return d!==null&&d<=14; });
  const holdings=vis.filter(c=>c.s==="em-holding");
  const maxHolding=holdings.reduce((mx,c)=>{ const d=days(c.la); return(d??0)>mx?d:mx; },0);
  const chips=[];
  if(alert30.length) chips.push(`<span class="ins-chip ins-alert">🔴 ${alert30.length} projeto${alert30.length>1?"s":""} com +30d sem avanço</span>`);
  if(warn15.length)  chips.push(`<span class="ins-chip ins-warn">⚠️ ${warn15.length} projeto${warn15.length>1?"s":""} com 15–30d sem avanço</span>`);
  if(ok14.length)    chips.push(`<span class="ins-chip ins-ok">✅ ${ok14.length} atualizado${ok14.length>1?"s":""} há menos de 14d</span>`);
  if(maxHolding>0&&holdings.length) chips.push(`<span class="ins-chip ins-info">🟣 Holding mais antigo: ${maxHolding}d parado</span>`);
  const total=vis.length;
  const concl=vis.filter(c=>c.s==="concluido").length;
  if(concl>0) chips.push(`<span class="ins-chip ins-neutral">🟢 ${concl} de ${total} concluído${concl>1?"s":""}</span>`);
  document.getElementById("insights-strip").innerHTML=chips.join("");
}

function matches(c){
  if(activeKpi!=="all"){
    if(activeKpi==="ativo"&&!ACTIVE.has(c.s))return false;
    if(activeKpi==="em-holding"&&c.s!=="em-holding")return false;
    if(activeKpi==="concluido"&&c.s!=="concluido")return false;
  }
  if(activeFilter!=="all"&&c.s!==activeFilter)return false;
  if(searchQ&&!c.n.toLowerCase().includes(searchQ))return false;
  return true;
}

function buildKpis(){
  document.getElementById("v-all").textContent=CARDS.length;
  document.getElementById("v-ativo").textContent=CARDS.filter(c=>ACTIVE.has(c.s)).length;
  document.getElementById("v-holding").textContent=CARDS.filter(c=>c.s==="em-holding").length;
  document.getElementById("v-concluido").textContent=CARDS.filter(c=>c.s==="concluido").length;
}

function setKpi(k){
  activeKpi=k;activeFilter="all";searchQ="";
  document.getElementById("search").value="";
  document.getElementById("sclear").style.display="none";
  ["all","ativo","em-holding","concluido"].forEach(id=>{
    document.getElementById("kpi-"+(id==="all"?"all":id==="ativo"?"ativo":id==="em-holding"?"holding":"concluido"))
      .classList.toggle("active",id===k);
  });
  document.querySelectorAll("#filter-btns .fbt").forEach(b=>b.classList.toggle("active",b.dataset.f==="all"));
  render();
}

document.getElementById("filter-btns").addEventListener("click",e=>{
  const b=e.target.closest(".fbt");if(!b)return;
  activeFilter=b.dataset.f;activeKpi="all";
  document.querySelectorAll("#filter-btns .fbt").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll(".kpi").forEach(k=>k.classList.remove("active"));
  render();
});

const srch=document.getElementById("search"),scl=document.getElementById("sclear");
srch.addEventListener("input",()=>{searchQ=srch.value.trim().toLowerCase();scl.style.display=searchQ?"block":"none";render();});
scl.addEventListener("click",()=>{srch.value="";searchQ="";scl.style.display="none";render();});

document.getElementById("sort-btn").addEventListener("click",()=>{
  if(sortOrder===null)       sortOrder="desc";
  else if(sortOrder==="desc")sortOrder="asc";
  else                       sortOrder=null;
  document.getElementById("sort-lbl").textContent=sortOrder==="asc"?"↑ Menos":"↓ Mais";
  document.getElementById("sort-btn").classList.toggle("active",sortOrder!==null);
  render();
});

function render(){
  let vis=CARDS.filter(matches);
  if(sortOrder){
    vis=[...vis].sort((a,b)=>{
      // Concluído sempre vai para o final
      const aConcl=a.s==="concluido"?1:0;
      const bConcl=b.s==="concluido"?1:0;
      if(aConcl!==bConcl) return aConcl-bConcl;
      // Dentro do mesmo grupo: ordena por dias sem avanço
      const da=days(a.la)??-1, db=days(b.la)??-1;
      return sortOrder==="desc"?db-da:da-db;
    });
  }
  document.getElementById("count-lbl").textContent=
    vis.length===CARDS.length?`${CARDS.length} projetos`:`${vis.length} de ${CARDS.length}`;
  const lblMap={"all":"","ativo":"Em Andamento","em-holding":"Em Holding","concluido":"Concluído"};
  const fLbl={"all":"","em-andamento":"Negociação","renovacao":"Renovações","em-analise":"Phase-out","a-fazer":"A Fazer","em-holding":"Holding","concluido":"Concluído"};
  const lbl=activeFilter!=="all"?fLbl[activeFilter]:(activeKpi!=="all"?lblMap[activeKpi]:"");
  document.getElementById("filter-lbl").textContent=lbl?`· filtro: ${lbl}`:"";

  buildInsights(vis);
  const grid=document.getElementById("cards-grid");
  if(!vis.length){grid.innerHTML='<div class="empty-msg">Nenhum projeto encontrado.</div>';updateMap(vis);return;}
  grid.innerHTML=vis.map(c=>{
    const st=SM[c.s];
    const d=days(c.la);
    const dCr=days(c.cr);
    const dueHtml=c.due?`<span class="due-badge${new Date(c.due)<TODAY?" due-over":""}">📅 ${fd(c.due)}</span>`:"";
    const db=diasBadge(d,c.s);
    const alertCls=c.s!=="concluido"&&d!==null?(d>30?" alert-card":d>14?" warn-card":""):"";
    const crRow=c.cr?`<div class="pcard-row"><span>📅 Criado</span><span class="v">${fd(c.cr)} <span style="color:#475569">(${dCr}d)</span></span></div>`:"";
    return`<div class="pcard${alertCls}">
      <div class="pcard-top"><span class="pcard-name">${c.n}</span><a class="pcard-link" href="${c.url}" target="_blank" rel="noopener" title="Abrir no Trello">↗</a></div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center"><span class="badge ${st.cls}">${st.label}</span>${dueHtml}</div>
      <div class="pcard-divider"></div>
      <div class="pcard-meta">
        ${crRow}
        <div class="pcard-row"><span>🔄 Atualizado</span><span class="v">${fd(c.la)}</span></div>
      </div>
      ${db?`<div style="margin-top:2px">${db}</div>`:""}
    </div>`;
  }).join("");
  updateMap(vis);
}

// ── MAP ───────────────────────────────────────────────────────────────────────
let map,mLayer;
const BRAZIL_BOUNDS=L.latLngBounds(L.latLng(-34.0,-75.0),L.latLng(5.5,-28.0));
function initMap(){
  map=L.map("map",{
    center:[-15,-52],zoom:4,
    attributionControl:false,
    minZoom:3,maxZoom:10,
    maxBounds:BRAZIL_BOUNDS,
    maxBoundsViscosity:0.85
  });
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:18}).addTo(map);
  mLayer=L.layerGroup().addTo(map);
  updateMap(CARDS);
}
function updateMap(vis){
  if(!mLayer)return;
  mLayer.clearLayers();
  const vs=new Set(vis.map(c=>c.n));
  CARDS.forEach(c=>{
    if(!c.lat)return;
    const on=vs.has(c.n);
    const d=days(c.la);
    const ds=c.s!=="concluido"&&d!==null?`<br>⏱ ${d}d sem avanço`:"";
    L.circleMarker([c.lat,c.lng],{radius:on?9:5,color:"#0f1117",weight:1.5,fillColor:on?MC[c.s]:"#2d3452",fillOpacity:on?.88:.22})
      .bindPopup(`<b>${c.n}</b><br>${SM[c.s].label}<br>🔄 ${fd(c.la)}${ds}`)
      .addTo(mLayer);
  });
}

document.getElementById("updated-lbl").textContent=
  "Sync "+new Date(UPDATED).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});

buildKpis();render();initMap();
</script>
